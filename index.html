<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <title>Frontend Mentor | Product preview card component</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <main>
      <div class="img-c">
        <img
          class="img-1"
          src="./assets/images/image-product-mobile.jpg"
          alt="Gabrielle Essence Eau De Parfum"
        />
        <img
          class="img-2"
          src="./assets/images/image-product-desktop.jpg"
          alt="Gabrielle Essence Eau De Parfum"
        />
      </div>
      <article class="card-container">
        <span class="tag">Perfume</span>
        <h1 class="main-title">Gabrielle Essence Eau De Parfum</h1>
        <p class="desciption">
          A floral, solar and voluptuous interpretation composed by Olivier
          Polge, Perfumer-Creator for the House of CHANEL.
        </p>
        <div class="price-c">
          <span class="price-1">$149.99</span
          ><span class="price-2">$19.99</span>
        </div>
        <button class="main-but">Add to Cart</button>
      </article>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="https://github.com">Waleed Thabit</a>.
    </footer>
  </body>
</html>
